name: Apply Alexa group HTTP 299 fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix, tests, version and changelog
        shell: python
        run: |
          from pathlib import Path

          group_manager = Path("alexa_device_management/rootfs/opt/alexa_device_management/web/alexa_group_manager.py")
          text = group_manager.read_text(encoding="utf-8")
          text = text.replace(
              '    if status != 200:\n        raise AlexaGroupError(f"Alexa-Gruppen konnten nicht geladen werden (HTTP {status}): {body[:200]}")',
              '    if not 200 <= status < 300:\n        raise AlexaGroupError(f"Alexa-Gruppen konnten nicht geladen werden (HTTP {status}): {body[:200]}")',
          )
          text = text.replace(
              '    if status not in (200, 201, 202, 204):\n',
              '    if not 200 <= status < 300:\n',
          )
          group_manager.write_text(text, encoding="utf-8")

          tests = Path("alexa_device_management/tests/test_alexa_group_manager.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              '    _ensure_assignment,\n    extract_groups,\n',
              '    _ensure_assignment,\n    _load_groups,\n    extract_groups,\n',
          )
          marker = '\n\nclass AlexaGroupAssignmentTests(unittest.IsolatedAsyncioTestCase):\n'
          test_case = '''\n\nclass AlexaGroupLoadTests(unittest.IsolatedAsyncioTestCase):\n    async def test_accepts_amazon_http_299_with_valid_group_payload(self) -> None:\n        server = FakeServer()\n\n        async def get_with_299(path: str, data: dict):\n            server.assert_path(path, "/api/phoenix")\n            return 299, server._payload()\n\n        server.alexa_raw_get = get_with_299\n\n        groups = await _load_groups(server, {})\n\n        self.assertEqual(len(groups), 1)\n        self.assertEqual(groups[0]["name"], "Wohnzimmer")\n'''
          if 'test_accepts_amazon_http_299_with_valid_group_payload' not in text:
              text = text.replace(marker, test_case + marker)
          tests.write_text(text, encoding="utf-8")

          config = Path("alexa_device_management/config.yaml")
          text = config.read_text(encoding="utf-8").replace('version: "2.14.1-rc1"', 'version: "2.14.2-rc1"')
          config.write_text(text, encoding="utf-8")

          server = Path("alexa_device_management/rootfs/opt/alexa_device_management/web/server_extended.py")
          text = server.read_text(encoding="utf-8").replace('APP_VERSION = "2.14.1-rc1"', 'APP_VERSION = "2.14.2-rc1"')
          server.write_text(text, encoding="utf-8")

          changelog = Path("alexa_device_management/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = '''## 2.14.2-rc1\n\n- **Fix Alexa-Gruppen**: Der Gruppenabruf akzeptiert jetzt alle erfolgreichen HTTP-2xx-Antworten. Amazons Status `299` mit gültigen Phoenix-Daten wird nicht mehr fälschlich als Fehler verworfen.\n- **Tests**: Regressionstest für den Gruppenabruf mit HTTP 299 ergänzt.\n\n'''
          if '## 2.14.2-rc1' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding="utf-8")

          Path('.github/workflows/fix-alexa-group-299.yml').unlink()

      - name: Run focused tests
        run: python -m unittest alexa_device_management/tests/test_alexa_group_manager.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: accept HTTP 299 for Alexa groups"
          git push
