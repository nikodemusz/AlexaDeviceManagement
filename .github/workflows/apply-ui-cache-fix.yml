name: Apply UI cache fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch release
        shell: python
        run: |
          from pathlib import Path

          root = Path('alexa_device_management')
          html = root / 'rootfs/opt/alexa_device_management/web/static/device_overview.html'
          text = html.read_text(encoding='utf-8')
          text = text.replace('/static/device_overview.css">', '/static/device_overview.css?v=2.15.1-rc1">')
          text = text.replace('/static/device_overview.js"></script>', '/static/device_overview.js?v=2.15.1-rc1"></script>')
          html.write_text(text, encoding='utf-8')

          css = root / 'rootfs/opt/alexa_device_management/web/static/device_overview.css'
          text = css.read_text(encoding='utf-8')
          text = text.replace('.device-head{display:grid;grid-template-columns:minmax(0,1fr) auto;', '.device-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;')
          text = text.replace('@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters #search{grid-column:1/-1}.device-head{grid-template-columns:1fr}', '@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters #search{grid-column:1/-1}.device-head{grid-template-columns:auto minmax(0,1fr)}.device-actions{grid-column:2}')
          css.write_text(text, encoding='utf-8')

          config = root / 'config.yaml'
          text = config.read_text(encoding='utf-8').replace('version: "2.15.0-rc1"', 'version: "2.15.1-rc1"')
          config.write_text(text, encoding='utf-8')

          server = root / 'rootfs/opt/alexa_device_management/web/server_extended.py'
          text = server.read_text(encoding='utf-8').replace('APP_VERSION = "2.15.0-rc1"', 'APP_VERSION = "2.15.1-rc1"')
          server.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          entry = '# Changelog\n\n## 2.15.1-rc1\n\n- **Fix**: Versionsgebundene CSS- und JavaScript-URLs verhindern, dass Home-Assistant-Ingress nach einem Update die alte Geräteoberfläche aus dem Browsercache lädt.\n- **Fix**: Der aufklappbare Gerätekopf verwendet das korrekte dreispaltige Layout für Pfeil, Gerätedaten und Aktionen.\n\n'
          if '## 2.15.1-rc1' not in text:
              text = text.replace('# Changelog\n\n', entry, 1)
          changelog.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-ui-cache-fix.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: invalidate cached device overview assets" || exit 0
          git push
