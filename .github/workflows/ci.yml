name: CI

on:
  push:
    branches: [main, feature/v2-architecture]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa_device_management
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alexa_device_management/rootfs/opt/alexa_device_management/web/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rootfs/opt/alexa_device_management/web/requirements.txt pytest

      - name: Compile runtime sources
        run: |
          python -m compileall -q rootfs/opt/alexa_device_management/web

      - name: Run unit tests
        run: pytest -q

      - name: Validate JavaScript syntax
        run: |
          find rootfs/opt/alexa_device_management/web/static -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Validate app metadata
        run: |
          python - <<'PY'
          import pathlib, yaml
          config = yaml.safe_load(pathlib.Path('config.yaml').read_text())
          assert config['name'] == 'Alexa Device Management'
          assert config['version']
          assert config['ingress'] is True
          assert config['homeassistant_api'] is True
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t alexa-device-management:ci alexa_device_management
