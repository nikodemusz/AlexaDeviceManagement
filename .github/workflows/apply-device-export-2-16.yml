name: Apply device-level Alexa export safeguards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-device-export-2-16.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('alexa_device_management')
          web = root / 'rootfs/opt/alexa_device_management/web'

          # UI: one-click device export and one primary entity per HA device.
          js_path = web / 'static/device_overview.js'
          js = js_path.read_text(encoding='utf-8')
          js = js.replace(
              'enabled: false, name: "", description: "", display_category: "", alexa_group: ""',
              'enabled: false, name: "", description: "", display_category: "", alexa_group: "", device_id: ""'
          )
          anchor = '''  function statusBadge(status) {'''
          helper = '''  function selectedEntities(device) {\n    return (device.entities || []).filter(entity => entityConfig(entity.entity_id).enabled);\n  }\n\n  function primaryEntity(device) {\n    return (device.entities || []).find(isUseful) || (device.entities || []).find(entity => !isTechnical(entity));\n  }\n\n  function applyDeviceExport(device, enabled) {\n    const candidate = primaryEntity(device);\n    if (enabled && !candidate) throw new Error("Für dieses Gerät wurde keine sinnvolle Alexa-Entität gefunden.");\n    for (const entity of device.entities || []) {\n      const settings = entityConfig(entity.entity_id);\n      settings.enabled = Boolean(enabled && entity === candidate);\n      settings.device_id = device.device_id;\n      entity.export.enabled = settings.enabled;\n    }\n    if (enabled) {\n      const settings = entityConfig(candidate.entity_id);\n      settings.name ||= suggestedName(candidate, device);\n      settings.display_category ||= suggestedCategory(candidate);\n      settings.alexa_group ||= device.area_name || "";\n    }\n    return candidate;\n  }\n\n'''
          if helper not in js:
              js = js.replace(anchor, helper + anchor)

          old_device = '''  function deviceHtml(device, entities) {\n    const expanded = expandedDevices.has(device.device_id);\n    return `<section class="device status-${attr(device.status)} ${device.hidden ? "hidden-item" : ""}" data-device-section="${attr(device.device_id)}"><div class="device-head"><button class="collapse-toggle" data-action="toggle-device" data-device="${attr(device.device_id)}" aria-expanded="${expanded}">${expanded ? "▾" : "▸"}</button><div class="device-title"><div class="device-name">${esc(device.name)}</div><div class="device-meta">${esc(device.area_name || "Kein Bereich")}${device.floor_name ? ` • ${esc(device.floor_name)}` : ""}${device.manufacturer ? ` • ${esc(device.manufacturer)}` : ""}${device.model ? ` • ${esc(device.model)}` : ""}</div></div><div class="device-actions"><button class="button primary small" data-action="prepare-device" data-device="${attr(device.device_id)}">Sinnvoll aktivieren</button><button class="button secondary small" data-action="${device.hidden ? "show-device" : "hide-device"}" data-device="${attr(device.device_id)}">${device.hidden ? "Einblenden" : "Gerät ausblenden"}</button></div></div>${expanded ? `<div class="entity-grid">${entities.map(entity => entityHtml(entity, device)).join("")}</div>` : ""}</section>`;\n  }'''
          new_device = '''  function deviceHtml(device, entities) {\n    const expanded = expandedDevices.has(device.device_id);\n    const selected = selectedEntities(device);\n    const exported = selected.length === 1;\n    const exportLabel = exported ? `Export entfernen (${selected[0].entity_id})` : selected.length > 1 ? `Mehrfachauswahl beheben (${selected.length})` : "Gerät exportieren";\n    const exportClass = exported ? "secondary" : selected.length > 1 ? "warning" : "primary";\n    return `<section class="device status-${attr(device.status)} ${device.hidden ? "hidden-item" : ""}" data-device-section="${attr(device.device_id)}"><div class="device-head"><button class="collapse-toggle" data-action="toggle-device" data-device="${attr(device.device_id)}" aria-expanded="${expanded}">${expanded ? "▾" : "▸"}</button><div class="device-title"><div class="device-name">${esc(device.name)}</div><div class="device-meta">${esc(device.area_name || "Kein Bereich")}${device.floor_name ? ` • ${esc(device.floor_name)}` : ""}${device.manufacturer ? ` • ${esc(device.manufacturer)}` : ""}${device.model ? ` • ${esc(device.model)}` : ""}</div></div><div class="device-actions"><button class="button ${exportClass} small" data-action="toggle-device-export" data-device="${attr(device.device_id)}">${esc(exportLabel)}</button><button class="button secondary small" data-action="${device.hidden ? "show-device" : "hide-device"}" data-device="${attr(device.device_id)}">${device.hidden ? "Einblenden" : "Gerät ausblenden"}</button></div></div>${expanded ? `<div class="entity-grid">${entities.map(entity => entityHtml(entity, device)).join("")}</div>` : ""}</section>`;\n  }'''
          if old_device not in js:
              raise SystemExit('deviceHtml anchor not found')
          js = js.replace(old_device, new_device)

          old_prepare = '''  async function prepareDevice(deviceId) {\n    const device = (model.devices || []).find(item => item.device_id === deviceId); if (!device) return;\n    const candidate = device.entities.find(isUseful) || device.entities.find(entity => !isTechnical(entity));\n    if (!candidate) return message("Für dieses Gerät wurde keine sinnvolle Alexa-Entität gefunden.", "err");\n    for (const entity of device.entities) entityConfig(entity.entity_id).enabled = false;\n    const settings = entityConfig(candidate.entity_id);\n    settings.enabled = true; settings.name ||= suggestedName(candidate, device); settings.display_category ||= suggestedCategory(candidate);\n    await saveConfig(); message(`${candidate.entity_id} wurde für Alexa vorbereitet.`); await load(false);\n  }'''
          new_prepare = '''  async function toggleDeviceExport(deviceId) {\n    const device = (model.devices || []).find(item => item.device_id === deviceId); if (!device) return;\n    const selected = selectedEntities(device);\n    const enable = selected.length !== 1;\n    const candidate = applyDeviceExport(device, enable);\n    render();\n    await saveConfig();\n    message(enable ? `Gerät „${device.name}“ wird über ${candidate.entity_id} exportiert.` : `Export für „${device.name}“ wurde entfernt.`);\n  }'''
          if old_prepare not in js:
              raise SystemExit('prepareDevice anchor not found')
          js = js.replace(old_prepare, new_prepare)
          js = js.replace(
              'else if (action === "prepare-device") await prepareDevice(button.dataset.device);',
              'else if (action === "toggle-device-export") await toggleDeviceExport(button.dataset.device);'
          )

          old_toggle = '''    if (target.classList.contains("export-toggle")) {\n      settings.enabled = target.checked;\n      if (target.checked) {\n        const device = model.devices.find(item => item.entities.some(entity => entity.entity_id === entityId));\n        const entity = device?.entities.find(item => item.entity_id === entityId);\n        if (device && entity) { settings.name ||= suggestedName(entity, device); settings.display_category ||= suggestedCategory(entity); }\n      }\n      await saveConfig(); await load(false);\n    }'''
          new_toggle = '''    if (target.classList.contains("export-toggle")) {\n      const device = model.devices.find(item => item.entities.some(entity => entity.entity_id === entityId));\n      const entity = device?.entities.find(item => item.entity_id === entityId);\n      if (device && entity && target.checked) {\n        for (const other of device.entities || []) {\n          const otherSettings = entityConfig(other.entity_id);\n          otherSettings.enabled = other.entity_id === entityId;\n          otherSettings.device_id = device.device_id;\n          other.export.enabled = otherSettings.enabled;\n        }\n        settings.name ||= suggestedName(entity, device);\n        settings.display_category ||= suggestedCategory(entity);\n        settings.alexa_group ||= device.area_name || "";\n      } else {\n        settings.enabled = false;\n        if (entity) entity.export.enabled = false;\n      }\n      render();\n      await saveConfig();\n    }'''
          if old_toggle not in js:
              raise SystemExit('entity toggle anchor not found')
          js = js.replace(old_toggle, new_toggle)

          old_fill = '''      const settings = entityConfig(entityId);\n      settings.name = suggestedName(entity, device); settings.display_category = suggestedCategory(entity); settings.alexa_group ||= device.area_name || ""; settings.enabled = true;\n      await saveConfig(); await load(false); return;'''
          new_fill = '''      for (const other of device.entities || []) {\n        const otherSettings = entityConfig(other.entity_id);\n        otherSettings.enabled = other.entity_id === entityId;\n        otherSettings.device_id = device.device_id;\n        other.export.enabled = otherSettings.enabled;\n      }\n      const settings = entityConfig(entityId);\n      settings.name = suggestedName(entity, device); settings.display_category = suggestedCategory(entity); settings.alexa_group ||= device.area_name || "";\n      render(); await saveConfig(); return;'''
          if old_fill not in js:
              raise SystemExit('fillEntity anchor not found')
          js = js.replace(old_fill, new_fill)

          old_bulk = '''    for (const device of model.devices || []) for (const entity of device.entities || []) if (entityMatchesFilter(entity, device, filter) && isUseful(entity)) {\n      const settings = entityConfig(entity.entity_id); settings.enabled = true; settings.name ||= suggestedName(entity, device); settings.display_category ||= suggestedCategory(entity);\n    }\n    await saveConfig(); await load(false);'''
          new_bulk = '''    for (const device of model.devices || []) {\n      const candidates = (device.entities || []).filter(entity => entityMatchesFilter(entity, device, filter) && isUseful(entity));\n      if (!candidates.length) continue;\n      const candidate = candidates[0];\n      for (const entity of device.entities || []) {\n        const settings = entityConfig(entity.entity_id);\n        settings.enabled = entity.entity_id === candidate.entity_id;\n        settings.device_id = device.device_id;\n        entity.export.enabled = settings.enabled;\n      }\n      const settings = entityConfig(candidate.entity_id);\n      settings.name ||= suggestedName(candidate, device); settings.display_category ||= suggestedCategory(candidate); settings.alexa_group ||= device.area_name || "";\n    }\n    render(); await saveConfig();'''
          if old_bulk not in js:
              raise SystemExit('bulk anchor not found')
          js = js.replace(old_bulk, new_bulk)
          js_path.write_text(js, encoding='utf-8')

          # Backend: attach HA device IDs to old and new configuration before saving/deploying.
          ha_export = web / 'ha_export.py'
          text = ha_export.read_text(encoding='utf-8')
          text = text.replace('import re\nfrom typing import Any', 'import re\nfrom copy import deepcopy\nfrom typing import Any')
          enrich = '''\n\nasync def enrich_device_ids(data: dict[str, Any]) -> dict[str, Any]:\n    """Attach stable HA device IDs so one physical device cannot be exported twice."""\n    result = deepcopy(data) if isinstance(data, dict) else {}\n    entities = result.get("entities") if isinstance(result.get("entities"), dict) else {}\n    inventory = await _inventory()\n    device_by_entity = {\n        str(entity.get("entity_id")): str(device.get("device_id") or "")\n        for device in inventory.get("devices", [])\n        for entity in device.get("entities", [])\n        if entity.get("entity_id")\n    }\n    for entity_id, settings in entities.items():\n        if isinstance(settings, dict):\n            settings["device_id"] = device_by_entity.get(str(entity_id), str(settings.get("device_id") or ""))\n    result["entities"] = entities\n    return result\n'''
          marker = '\ndef _dump_yaml(data: dict[str, Any]) -> str:\n'
          if enrich not in text:
              text = text.replace(marker, enrich + marker)
          text = text.replace('saved = _save_state(await request.json())', 'saved = _save_state(await enrich_device_ids(await request.json()))')
          text = text.replace('generated = YAML_GENERATOR.generate(await request.json())', 'generated = YAML_GENERATOR.generate(await enrich_device_ids(await request.json()))')
          text = text.replace('requested = await request.json()\n        saved = _save_state(requested)', 'requested = await enrich_device_ids(await request.json())\n        saved = _save_state(requested)')
          ha_export.write_text(text, encoding='utf-8')

          # Deployment path also enriches persisted legacy configurations.
          ha_control = web / 'ha_control.py'
          text = ha_control.read_text(encoding='utf-8')
          text = text.replace(
              'if isinstance(payload, dict) and payload:\n            ha_export._save_state(payload)\n\n        persisted = ha_export._load_state()',
              'if isinstance(payload, dict) and payload:\n            ha_export._save_state(await ha_export.enrich_device_ids(payload))\n\n        persisted = await ha_export.enrich_device_ids(ha_export._load_state())\n        ha_export._save_state(persisted)'
          )
          ha_control.write_text(text, encoding='utf-8')

          # Generator hard-stop for multiple selected entities of one physical device.
          generator = web / 'yaml_generator.py'
          text = generator.read_text(encoding='utf-8')
          anchor = '''        smart_home: dict[str, Any] = {'''
          validation = '''        selected_by_device: dict[str, list[str]] = {}\n        for entity_id, settings in selected.items():\n            device_id = settings.get("device_id", "")\n            if device_id:\n                selected_by_device.setdefault(device_id, []).append(entity_id)\n        duplicates = {device_id: ids for device_id, ids in selected_by_device.items() if len(ids) > 1}\n        if duplicates:\n            details = "; ".join(f"{device_id}: {', '.join(sorted(ids))}" for device_id, ids in sorted(duplicates.items()))\n            raise GeneratorValidationError(\n                "Mehrere Alexa-Endpunkte für dasselbe Home-Assistant-Gerät sind aktiviert. "\n                "Bitte genau eine Haupt-Entity auswählen: " + details\n            )\n\n'''
          if validation not in text:
              text = text.replace(anchor, validation + anchor)
          text = text.replace(
              '"display_category": category,\n            }',
              '"display_category": category,\n                "device_id": str(raw_settings.get("device_id") or "").strip(),\n            }'
          )
          generator.write_text(text, encoding='utf-8')

          # Regression test.
          tests = root / 'tests/test_yaml_generator.py'
          text = tests.read_text(encoding='utf-8')
          test = '''\n    def test_rejects_multiple_entities_for_same_device(self) -> None:\n        generator = AlexaYamlGenerator(pathlib.Path("/tmp/alexa.yaml"))\n        with self.assertRaisesRegex(GeneratorValidationError, "genau eine Haupt-Entity"):\n            generator.generate({\n                "entities": {\n                    "light.controller": {"enabled": True, "device_id": "device-1"},\n                    "switch.controller": {"enabled": True, "device_id": "device-1"},\n                }\n            })\n'''
          if test not in text:
              text = text.replace('\n    def test_rejects_invalid_entity_id', test + '\n    def test_rejects_invalid_entity_id')
          tests.write_text(text, encoding='utf-8')

          # Version and cache busting: development version, no RC suffix.
          config = root / 'config.yaml'
          text = config.read_text(encoding='utf-8')
          text = text.replace('version: "2.15.1-rc1"', 'version: "2.16.0"')
          config.write_text(text, encoding='utf-8')

          server = web / 'server_extended.py'
          text = server.read_text(encoding='utf-8').replace('APP_VERSION = "2.15.1-rc1"', 'APP_VERSION = "2.16.0"')
          server.write_text(text, encoding='utf-8')

          html = web / 'static/device_overview.html'
          text = html.read_text(encoding='utf-8')
          text = text.replace('device_overview.css?v=2.15.1-rc1', 'device_overview.css?v=2.16.0')
          text = text.replace('device_overview.js?v=2.15.1-rc1', 'device_overview.js?v=2.16.0')
          html.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 2.16.0\n\n- **Geräteexport**: Ganze HA-Geräte können im geschlossenen Gerätekopf exportiert oder deaktiviert werden; automatisch wird genau eine sinnvolle Haupt-Entity gewählt.\n- **Duplikatschutz**: UI, Preview und Deployment verhindern mehrere aktive Alexa-Endpunkte für dasselbe physische HA-Gerät. Bestehende Konfigurationen werden dafür automatisch um die HA-Geräte-ID ergänzt.\n- **Versionierung**: Entwicklungsstände werden nicht mehr als Release Candidate (`rc`) bezeichnet.\n\n'''
          if '## 2.16.0\n' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          # Remove abandoned trigger files and this one-shot workflow.
          for path in Path('.github').glob('device-export-trigger*.txt'):
              path.unlink()
          Path('.github/workflows/apply-device-export-2-16.yml').unlink()
          PY

      - name: Run tests
        run: python3 -m unittest discover -s alexa_device_management/tests -p 'test_*.py'

      - name: Commit feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add device-level Alexa export safeguards"
          git push
