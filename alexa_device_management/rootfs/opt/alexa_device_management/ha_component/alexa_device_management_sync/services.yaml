sync:
  name: Alexa-Endpunkte synchronisieren
  description: Sendet AddOrUpdateReport und DeleteReport an das Alexa Event Gateway.
  fields:
    native_endpoints:
      name: Native v6-Endpunkte
      description: Vollständige Discovery-Endpunkte mit stabiler native:-ID.
      selector:
        object:
    delete_endpoint_ids:
      name: Endpunkt-IDs löschen
      selector:
        object:
    add_or_update:
      name: Historische v5-Updates (gesperrt)
      example:
        - light.wohnzimmer
      selector:
        object:
    delete:
      name: Löschen
      example:
        - switch.altes_geraet
      selector:
        object:
    entity_config:
      name: Alexa-Entitätskonfiguration
      selector:
        object:
