# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Alexa Device Management
version: "2.19.0"
slug: alexa_device_management
description: Standalone web UI to manage Amazon Alexa smart home devices and configure Home Assistant devices for Alexa.
url: "https://github.com/nikodemusz/AlexaDeviceManagement/tree/main/alexa_device_management"
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
apparmor: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:speaker"
panel_title: "Alexa Devices"
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Native Alexa Skill Gateway (proxy HTTPS externally)
options:
  native_gateway_token: ""
schema:
  native_gateway_token: password?
