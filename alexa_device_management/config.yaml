# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Alexa Device Management
version: "0.8.3"
slug: alexa_device_management
description: Standalone web UI to manage Amazon Alexa smart home devices – a better replacement for the Alexa App.
url: "https://github.com/nikodemusz/AlexaDeviceManagement/tree/main/alexa_device_management"
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
apparmor: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:amazon-alexa"
panel_title: "Alexa Devices"
options:
  amazon_region: "eu"
  client_id: ""
  client_secret: ""
  refresh_token: ""
  alexa_host: "alexa.amazon.de"
  alexa_cookie: ""
  alexa_csrf: ""
schema:
  amazon_region: "str"
  client_id: "str"
  client_secret: "password"
  refresh_token: "password?"
  alexa_host: "str"
  alexa_cookie: "password?"
  alexa_csrf: "password?"
